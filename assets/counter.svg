<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1d8"/>
      <stop offset=".45" stop-color="#f0d4ac"/>
      <stop offset="1" stop-color="#dcb98d"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e3c6"/>
      <stop offset=".5" stop-color="#ead0ac"/>
      <stop offset="1" stop-color="#d8b58b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeed8"/>
      <stop offset="1" stop-color="#eed7b4"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f0ea"/>
      <stop offset="1" stop-color="#cfc9bd"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe6f2"/>
      <stop offset=".55" stop-color="#8fd0e6"/>
      <stop offset="1" stop-color="#6bb9d4"/>
    </linearGradient>
  </defs>

  <!-- 台面 -->
  <rect x="2" y="62" width="556" height="30" rx="12" fill="url(#top)" stroke="#b98f63" stroke-width="2.6"/>
  <rect x="10" y="67" width="540" height="7" rx="3.5" fill="#fff" opacity=".5"/>
  <rect x="2" y="90" width="556" height="8" rx="4" fill="#b98f63" opacity=".45"/>

  <!-- 收银机 -->
  <g>
    <rect x="286" y="40" width="118" height="22" rx="6" fill="url(#metal)" stroke="#8f897e" stroke-width="2"/>
    <rect x="292" y="12" width="106" height="34" rx="7" fill="url(#screen)" stroke="#5e9fb4" stroke-width="2.2"/>
    <rect x="300" y="18" width="58" height="5" rx="2.5" fill="#fff" opacity=".7"/>
    <rect x="300" y="27" width="80" height="4" rx="2" fill="#fff" opacity=".45"/>
    <rect x="300" y="34" width="42" height="4" rx="2" fill="#fff" opacity=".35"/>
    <circle cx="404" cy="26" r="4" fill="#ffd166" stroke="#b5842f" stroke-width="1.4"/>
    <rect x="404" y="44" width="62" height="14" rx="4" fill="#cfc9bd" stroke="#8f897e" stroke-width="1.6"/>
    <g fill="#8f897e">
      <circle cx="414" cy="51" r="2"/>
      <circle cx="424" cy="51" r="2"/>
      <circle cx="434" cy="51" r="2"/>
      <circle cx="444" cy="51" r="2"/>
    </g>
  </g>

  <!-- 小票 / 托盘 -->
  <g>
    <rect x="236" y="50" width="34" height="14" rx="3" fill="#fffdf6" stroke="#d9c3a2" stroke-width="1.4"/>
    <path d="M241 55 h24 M241 59 h16" stroke="#c9b49a" stroke-width="1.4"/>
  </g>

  <!-- 柜台正面 -->
  <rect x="8" y="96" width="544" height="206" rx="12" fill="url(#body)" stroke="#b98f63" stroke-width="2.6"/>

  <!-- 面板分割 -->
  <g stroke="#c9a57c" stroke-width="2" opacity=".65">
    <path d="M22 108 V290"/>
    <path d="M538 108 V290"/>
    <path d="M22 176 H538"/>
  </g>

  <!-- 上层面板（浅色） -->
  <rect x="34" y="108" width="492" height="58" rx="8" fill="url(#panel)" opacity=".85"/>
  <g fill="none" stroke="#d9bd97" stroke-width="1.8" opacity=".7">
    <rect x="48" y="118" width="150" height="38" rx="6"/>
    <rect x="214" y="118" width="150" height="38" rx="6"/>
    <rect x="380" y="118" width="132" height="38" rx="6"/>
  </g>

  <!-- 抽屉 -->
  <g>
    <rect x="40" y="188" width="230" height="86" rx="9" fill="url(#panel)" stroke="#cfae86" stroke-width="2"/>
    <rect x="290" y="188" width="230" height="86" rx="9" fill="url(#panel)" stroke="#cfae86" stroke-width="2"/>
    <rect x="146" y="204" width="52" height="10" rx="5" fill="#c9a05f" stroke="#a57f3f" stroke-width="1.4"/>
    <rect x="396" y="204" width="52" height="10" rx="5" fill="#c9a05f" stroke="#a57f3f" stroke-width="1.4"/>
    <rect x="146" y="203" width="52" height="4" rx="2" fill="#ffe2a8" opacity=".7"/>
    <rect x="396" y="203" width="52" height="4" rx="2" fill="#ffe2a8" opacity=".7"/>
    <rect x="60" y="232" width="190" height="6" rx="3" fill="#e0c39d" opacity=".7"/>
    <rect x="310" y="232" width="190" height="6" rx="3" fill="#e0c39d" opacity=".7"/>
  </g>

  <!-- 价签 -->
  <g transform="translate(70,150)">
    <rect width="46" height="18" rx="5" fill="#fffdf4" stroke="#d9bd97" stroke-width="1.6"/>
    <text x="23" y="13" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="11" font-weight="700" fill="#a5713c">¥120</text>
  </g>
  <g transform="translate(446,150)">
    <rect width="46" height="18" rx="5" fill="#fffdf4" stroke="#d9bd97" stroke-width="1.6"/>
    <text x="23" y="13" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="11" font-weight="700" fill="#a5713c">NEW</text>
  </g>

  <!-- 踢脚 -->
  <rect x="8" y="288" width="544" height="16" rx="6" fill="#a97f57" opacity=".55"/>
  <rect x="8" y="288" width="544" height="5" fill="#c9a57c" opacity=".5"/>

  <!-- 高光 -->
  <rect x="18" y="100" width="6" height="180" rx="3" fill="#fff" opacity=".35"/>
  <path d="M18 96 H120" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".35"/>
</svg>
