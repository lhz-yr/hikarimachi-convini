    <path d="M482 20 h216 v96 q-8 10 -16 0 q-9 10 -18 0 q-9 10 -18 0 q-9 10 -18 0 q-9 10 -18 0 q-9 10 -18 0 q-9 10 -18 0 q-9 10 -18 0 q-9 10 -18 0 q-9 10 -18 0 q-9 10 -18 0 q-9 10 -18 0 V20 Z" fill="url(#cloth)" stroke="#dcc2a0" stroke-width="2"/>
