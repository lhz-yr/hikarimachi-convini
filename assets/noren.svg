<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="720" height="150" preserveAspectRatio="none">
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e8"/>
      <stop offset=".5" stop-color="#f9ecd6"/>
      <stop offset="1" stop-color="#f2dfc1"/>
    </linearGradient>
    <linearGradient id="cloth2" x1="0" y1="0" x2="0" y2="1">
