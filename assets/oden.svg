<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 140" width="170" height="140">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f2ec"/>
      <stop offset=".45" stop-color="#d9d4c9"/>
      <stop offset="1" stop-color="#eeebe3"/>
    </linearGradient>
    <linearGradient id="broth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7cf8d"/>
      <stop offset="1" stop-color="#dfa45b"/>
    </linearGradient>
    <linearGradient id="wood2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c9a2"/>
      <stop offset="1" stop-color="#c99c6d"/>
    </linearGradient>
  </defs>

  <!-- 木架 -->
  <rect x="6" y="104" width="158" height="14" rx="7" fill="url(#wood2)" stroke="#a97f57" stroke-width="2.2"/>
  <rect x="18" y="118" width="12" height="20" rx="4" fill="#b98f63" stroke="#a5713c" stroke-width="1.8"/>
  <rect x="140" y="118" width="12" height="20" rx="4" fill="#b98f63" stroke="#a5713c" stroke-width="1.8"/>
  <rect x="26" y="132" width="118" height="6" rx="3" fill="#a97f57" opacity=".5"/>

  <!-- 锅体 -->
  <path d="M22 52 h126 l-10 52 q-53 8 -106 0 Z" fill="url(#steel)" stroke="#8f897e" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="85" cy="52" rx="63" ry="13" fill="#e9e4d9" stroke="#8f897e" stroke-width="2.4"/>
  <ellipse cx="85" cy="53" rx="55" ry="9.5" fill="url(#broth)" stroke="#c98a4c" stroke-width="1.8"/>

  <!-- 分格 -->
  <g stroke="#b0a99b" stroke-width="2.4" opacity=".9">
    <path d="M57 55 V92"/>
    <path d="M113 55 V92"/>
  </g>

  <!-- 高汤泡泡 -->
  <g fill="#ffe4b0" opacity=".9">
    <circle cx="40" cy="56" r="3.4"/>
    <circle cx="70" cy="60" r="2.6"/>
    <circle cx="98" cy="55" r="3"/>
    <circle cx="128" cy="60" r="2.4"/>
  </g>

  <!-- 关东煮串 -->
  <g>
    <g transform="translate(40,46) rotate(-8)">
      <rect x="-2" y="-4" width="3.4" height="38" rx="1.7" fill="#d9bb8f" stroke="#b98f63" stroke-width="1"/>
      <circle cx="0" cy="6" r="8" fill="#fff5e2" stroke="#c9a37a" stroke-width="1.6"/>
      <path d="M-5 4 q5 4 10 0" stroke="#e8d2b0" stroke-width="1.4" fill="none"/>
    </g>
    <g transform="translate(70,48) rotate(4)">
      <rect x="-2" y="-4" width="3.4" height="36" rx="1.7" fill="#d9bb8f" stroke="#b98f63" stroke-width="1"/>
      <rect x="-8" y="2" width="16" height="15" rx="5" fill="#f3d6a8" stroke="#c9a37a" stroke-width="1.6"/>
      <path d="M-5 8 h10" stroke="#e2c396" stroke-width="1.4"/>
    </g>
    <g transform="translate(100,46) rotate(-4)">
      <rect x="-2" y="-6" width="3.4" height="38" rx="1.7" fill="#d9bb8f" stroke="#b98f63" stroke-width="1"/>
      <path d="M0 2 q10 4 0 16 q-10 -4 0 -16" fill="#f5c451" stroke="#b5842f" stroke-width="1.6"/>
    </g>
    <g transform="translate(128,48) rotate(6)">
      <rect x="-2" y="-4" width="3.4" height="36" rx="1.7" fill="#d9bb8f" stroke="#b98f63" stroke-width="1"/>
      <rect x="-7" y="2" width="14" height="14" rx="4" fill="#f6e3c2" stroke="#c9a37a" stroke-width="1.6"/>
      <path d="M-4 7 h8 M-4 11 h8" stroke="#e2c396" stroke-width="1.3"/>
    </g>
  </g>

  <!-- 锅沿高光 -->
  <path d="M28 52 q57 -10 114 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/>
  <path d="M30 60 q50 6 104 2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".3"/>
</svg>
