<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 440" width="240" height="440" preserveAspectRatio="none">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0e3cf"/>
      <stop offset=".5" stop-color="#cdb08b"/>
      <stop offset="1" stop-color="#ecdcc4"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e6" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffe9c2" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <!-- 门外框 -->
  <rect x="8" y="10" width="224" height="422" rx="12" fill="url(#frame)" stroke="#a8835c" stroke-width="3"/>
  <rect x="18" y="20" width="204" height="402" rx="6" fill="url(#inner)"/>

  <!-- 门框竖梃 -->
  <rect x="116" y="24" width="16" height="398" rx="7" fill="url(#frame)" stroke="#a8835c" stroke-width="2"/>
  <rect x="121" y="30" width="5" height="386" rx="2.5" fill="#fff" opacity=".45"/>

  <!-- 顶部标牌 -->
  <rect x="40" y="10" width="160" height="26" rx="10" fill="#7cc4a4" stroke="#4f9a7c" stroke-width="2"/>
  <text x="120" y="28" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="4">自動ドア</text>

  <!-- 贴纸 -->
  <g transform="translate(74,318)">
    <circle r="22" fill="#fff7e6" stroke="#e0b98a" stroke-width="2"/>
    <circle r="15" fill="none" stroke="#f2a15d" stroke-width="3" stroke-dasharray="4 5"/>
    <path d="M-7 0 q7 8 14 0" stroke="#7a5b3e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <circle cx="-6" cy="-5" r="2" fill="#7a5b3e"/>
    <circle cx="6" cy="-5" r="2" fill="#7a5b3e"/>
  </g>

  <!-- 地弹簧 -->
  <rect x="8" y="428" width="224" height="8" rx="4" fill="#c9a87f" stroke="#a8835c" stroke-width="1.6"/>
</svg>
