<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 110" width="90" height="110">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f3e7d6"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a6"/>
      <stop offset="1" stop-color="#eeae37"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b7c8"/>
      <stop offset="1" stop-color="#e58fa8"/>
    </linearGradient>
  </defs>

  <!-- 坐垫 -->
  <ellipse cx="45" cy="100" rx="33" ry="9" fill="url(#cushion)" stroke="#c9708c" stroke-width="2"/>
  <ellipse cx="45" cy="97" rx="26" ry="6" fill="#ffd9e2" opacity=".6"/>

  <!-- 尾巴 -->
  <path d="M20 86 q-12 -6 -8 -18 q3 -8 10 -4" fill="none" stroke="#c9a87f" stroke-width="7" stroke-linecap="round"/>

  <!-- 身体 -->
  <ellipse cx="45" cy="80" rx="26" ry="24" fill="url(#fur)" stroke="#b98f63" stroke-width="2.4"/>
  <ellipse cx="45" cy="84" rx="18" ry="16" fill="#fff" opacity=".7"/>

  <!-- 举起的前爪 -->
  <g transform="rotate(-8 72 44)">
    <rect x="64" y="26" width="15" height="34" rx="7.5" fill="url(#fur)" stroke="#b98f63" stroke-width="2.2"/>
    <path d="M68 32 v10 M72 31 v11 M76 32 v10" stroke="#d9c3a2" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- 头 -->
  <circle cx="45" cy="40" r="25" fill="url(#fur)" stroke="#b98f63" stroke-width="2.4"/>

  <!-- 耳朵 -->
  <path d="M25 24 L22 6 L40 17 Z" fill="url(#fur)" stroke="#b98f63" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M65 24 L68 6 L50 17 Z" fill="url(#fur)" stroke="#b98f63" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M27 21 L26 12 L35 18 Z" fill="#f7b7c8"/>
  <path d="M63 21 L64 12 L55 18 Z" fill="#f7b7c8"/>

  <!-- 脸 -->
  <path d="M33 39 q5 -5 10 0" stroke="#6b5443" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M47 39 q5 -5 10 0" stroke="#6b5443" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M41 46 q4 4 8 0" stroke="#c9705c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="28" cy="46" rx="4.4" ry="2.6" fill="#ffb0b0" opacity=".65"/>
  <ellipse cx="62" cy="46" rx="4.4" ry="2.6" fill="#ffb0b0" opacity=".65"/>
  <path d="M17 42 h8 M17 47 h8 M65 42 h8 M65 47 h8" stroke="#c9a87f" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 项圈 -->
  <path d="M26 57 q19 9 38 0" stroke="#ef6f63" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="45" cy="62" r="6" fill="url(#gold2)" stroke="#c08a26" stroke-width="1.6"/>
  <path d="M42 60 h6 M42 63 h6" stroke="#a5713c" stroke-width="1.2"/>

  <!-- 金币 -->
  <ellipse cx="45" cy="84" rx="15" ry="11" fill="url(#gold2)" stroke="#c08a26" stroke-width="2"/>
  <ellipse cx="45" cy="84" rx="10" ry="7" fill="none" stroke="#b5842f" stroke-width="1.4" opacity=".8"/>
  <text x="45" y="88" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="8" font-weight="900" fill="#8a5f2f">千万</text>

  <!-- 高光 -->
  <circle cx="34" cy="27" r="4" fill="#fff" opacity=".75"/>
  <path d="M28 70 q8 8 17 8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".7"/>
</svg>
