<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bgWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset=".42" stop-color="#fff6e6"/>
      <stop offset="1" stop-color="#f8ead4"/>
    </linearGradient>
    <linearGradient id="bgCeil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f7ecd9"/>
    </linearGradient>
    <linearGradient id="bgFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d9b8"/>
      <stop offset=".38" stop-color="#f7e3c6"/>
      <stop offset="1" stop-color="#e6c39c"/>
    </linearGradient>
    <linearGradient id="bgTrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe8cc"/>
      <stop offset="1" stop-color="#dfbd96"/>
    </linearGradient>
    <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcb992"/>
      <stop offset="1" stop-color="#c69d74"/>
    </linearGradient>
    <linearGradient id="bgWoodBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d3b4"/>
      <stop offset=".5" stop-color="#d9bd97"/>
      <stop offset="1" stop-color="#c4a179"/>
    </linearGradient>
    <radialGradient id="bgSun" cx=".86" cy=".02" r=".82">
      <stop offset="0" stop-color="#fff8d8" stop-opacity=".95"/>
      <stop offset=".42" stop-color="#fff4cf" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff4cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgWarm" cx=".5" cy=".55" r=".62">
      <stop offset="0" stop-color="#ffeecd" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffeecd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff4fd"/>
      <stop offset=".55" stop-color="#bfe7f8"/>
      <stop offset="1" stop-color="#e9f8fe"/>
    </linearGradient>
    <linearGradient id="bgLightRay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9dd" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff9dd" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff9dd" stop-opacity="0"/>
    </linearGradient>
    <pattern id="bgStripes" width="84" height="84" patternUnits="userSpaceOnUse">
      <path d="M21 0 V84" stroke="#f2e2c9" stroke-width="6" opacity=".45"/>
      <path d="M63 0 V84" stroke="#fffaf0" stroke-width="5" opacity=".75"/>
      <circle cx="42" cy="24" r="2" fill="#efdcc0" opacity=".45"/>
      <circle cx="42" cy="60" r="2" fill="#efdcc0" opacity=".45"/>
    </pattern>
    <pattern id="bgTiles" width="260" height="150" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="260" height="150" fill="none"/>
      <path d="M0 2 H260" stroke="#d3ab81" stroke-width="3.6" opacity=".42"/>
      <path d="M0 5 H260" stroke="#fbe6c8" stroke-width="2.6" opacity=".6"/>
      <path d="M130 2 V150" stroke="#d6ae85" stroke-width="3" opacity=".3"/>
      <path d="M133 2 V150" stroke="#fbe8cc" stroke-width="2" opacity=".45"/>
      <path d="M42 18 q30 7 58 0" stroke="#dbb78f" stroke-width="1.4" fill="none" opacity=".3"/>
      <path d="M152 92 q30 -6 62 0" stroke="#dbb78f" stroke-width="1.4" fill="none" opacity=".26"/>
    </pattern>
    <filter id="bgSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="bgSofter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- ========== 天花板 ========== -->
  <rect width="1200" height="72" fill="url(#bgCeil)"/>
  <g opacity=".85">
    <rect x="0" y="10" width="1200" height="9" rx="4.5" fill="url(#bgWoodBeam)"/>
    <rect x="0" y="10" width="1200" height="3" rx="1.5" fill="#fff8e9" opacity=".75"/>
    <rect x="0" y="46" width="1200" height="5" rx="2.5" fill="#e8d3b3" opacity=".7"/>
  </g>
  <rect y="62" width="1200" height="12" fill="url(#bgTrim)"/>
  <rect y="62" width="1200" height="3" fill="#fffdf6" opacity=".95"/>
  <rect y="72" width="1200" height="7" fill="#c9a479" opacity=".22" filter="url(#bgSoft)"/>

  <!-- ========== 墙面 ========== -->
  <rect y="72" width="1200" height="392" fill="url(#bgWall)"/>
  <rect y="72" width="1200" height="392" fill="url(#bgStripes)"/>
  <rect y="72" width="1200" height="392" fill="url(#bgWarm)"/>
  <rect width="1200" height="760" fill="url(#bgSun)"/>

  <!-- 墙面高光（二次元感的分层光） -->
  <path d="M760 72 H1200 V300 L760 190 Z" fill="#fff8e2" opacity=".42"/>
  <path d="M0 72 H180 V210 L0 250 Z" fill="#fffdf4" opacity=".5"/>

  <!-- 吊灯 ×2 -->
  <g>
    <path d="M250 72 V104" stroke="#c9a982" stroke-width="3"/>
    <path d="M205 148 q45 -42 90 0 z" fill="#fff0cd" stroke="#d9ab7c" stroke-width="2.6" stroke-linejoin="round"/>
    <ellipse cx="250" cy="150" rx="28" ry="7" fill="#fff7dd" stroke="#e2b98d" stroke-width="2"/>
    <ellipse cx="250" cy="150" rx="46" ry="16" fill="#ffeec0" opacity=".55" filter="url(#bgSoft)"/>
    <circle cx="250" cy="154" r="5" fill="#fff6cf"/>

    <path d="M700 72 V100" stroke="#c9a982" stroke-width="3"/>
    <path d="M655 144 q45 -42 90 0 z" fill="#fff0cd" stroke="#d9ab7c" stroke-width="2.6" stroke-linejoin="round"/>
    <ellipse cx="700" cy="146" rx="28" ry="7" fill="#fff7dd" stroke="#e2b98d" stroke-width="2"/>
    <ellipse cx="700" cy="146" rx="46" ry="16" fill="#ffeec0" opacity=".45" filter="url(#bgSoft)"/>
    <circle cx="700" cy="150" r="5" fill="#fff6cf"/>
  </g>

  <!-- 壁灯 -->
  <g opacity=".9">
    <rect x="1032" y="236" width="11" height="44" rx="5" fill="#d9b78f"/>
    <path d="M996 282 q41 -28 83 0 z" fill="#fff0cd" stroke="#d9ab7c" stroke-width="2.4" stroke-linejoin="round"/>
    <ellipse cx="1038" cy="284" rx="48" ry="14" fill="#ffeec0" opacity=".5" filter="url(#bgSoft)"/>
  </g>

  <!-- 墙上时钟 -->
  <g>
    <circle cx="884" cy="102" r="30" fill="#fffdf7" stroke="#c9a67c" stroke-width="3.4"/>
    <circle cx="884" cy="102" r="24.5" fill="#fff8e8" stroke="#e8d2b2" stroke-width="1.6"/>
    <g stroke="#a98a6c" stroke-width="2" stroke-linecap="round">
      <path d="M884 84 V90"/>
      <path d="M884 114 V120"/>
      <path d="M866 102 H872"/>
      <path d="M896 102 H902"/>
    </g>
    <path d="M884 102 V88" stroke="#7a5b3e" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M884 102 L900 110" stroke="#e0873f" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="884" cy="102" r="2.6" fill="#7a5b3e"/>
    <ellipse cx="876" cy="90" rx="9" ry="5" fill="#fff" opacity=".55"/>
  </g>

  <!-- 墙角线 / 踢脚线 -->
  <rect y="438" width="1200" height="26" fill="url(#bgBase)"/>
  <rect y="438" width="1200" height="4" fill="#f0d3ac"/>
  <rect y="459" width="1200" height="4" fill="#a97f57" opacity=".45"/>
  <rect y="430" width="1200" height="9" fill="#c9a479" opacity=".18" filter="url(#bgSoft)"/>

  <!-- ========== 地板 ========== -->
  <rect y="464" width="1200" height="296" fill="url(#bgFloor)"/>
  <rect y="464" width="1200" height="296" fill="url(#bgTiles)"/>
  <path d="M0 464 H1200 V488 H0 Z" fill="#ffedcf" opacity=".55"/>

  <!-- 货架下的阴影 -->
  <ellipse cx="430" cy="486" rx="400" ry="26" fill="#b78f66" opacity=".22" filter="url(#bgSofter)"/>

  <!-- 阳光光池（从右侧门口洒进来） -->
  <g opacity=".75">
    <path d="M1040 486 L1200 470 L1200 700 L830 620 Z" fill="#fff6d8" opacity=".5" filter="url(#bgSofter)"/>
    <path d="M820 470 L1200 452 L1200 620 L780 560 Z" fill="#fff9e4" opacity=".32" filter="url(#bgSofter)"/>
  </g>

  <!-- 地板反光条 -->
  <ellipse cx="300" cy="560" rx="330" ry="40" fill="#fff8e7" opacity=".3"/>
  <ellipse cx="880" cy="620" rx="250" ry="34" fill="#fff8e7" opacity=".28"/>

  <!-- 光柱 -->
  <g opacity=".5">
    <path d="M900 72 L1200 72 L1040 500 L760 470 Z" fill="url(#bgLightRay)" filter="url(#bgSoft)"/>
    <path d="M1080 72 L1180 72 L1120 430 L1010 420 Z" fill="url(#bgLightRay)" opacity=".7" filter="url(#bgSoft)"/>
  </g>

  <!-- 二次元闪光点 -->
  <g fill="#fffdf0" opacity=".9">
    <path d="M960 250 l3.4 9.4 9.4 3.4 -9.4 3.4 -3.4 9.4 -3.4 -9.4 -9.4 -3.4 9.4 -3.4 z"/>
    <path d="M1052 340 l2.6 7 7 2.6 -7 2.6 -2.6 7 -2.6 -7 -7 -2.6 7 -2.6 z" opacity=".8"/>
    <path d="M180 320 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4 z" opacity=".55"/>
  </g>

  <!-- 整体暖光与暗角 -->
  <rect width="1200" height="760" fill="url(#bgSun)" opacity=".2"/>
  <path d="M0 0 H1200 V760 H0 Z" fill="none" stroke="#b98f63" stroke-opacity=".18" stroke-width="6"/>
</svg>
